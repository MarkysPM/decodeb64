<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://decodeb64.com/" />
  <link rel="alternate" hreflang="en" href="https://decodeb64.com/en/" />
  <link rel="alternate" hreflang="es" href="https://decodeb64.com/es/" />
  <link rel="alternate" hreflang="pt" href="https://decodeb64.com/pt/" />
  <link rel="alternate" hreflang="fr" href="https://decodeb64.com/fr/" />
  <link rel="alternate" hreflang="de" href="https://decodeb64.com/de/" />
  <link rel="alternate" hreflang="it" href="https://decodeb64.com/it/" />
  <link rel="alternate" hreflang="zh" href="https://decodeb64.com/zh/" />
  <link rel="alternate" hreflang="ru" href="https://decodeb64.com/ru/" />
  <link rel="alternate" hreflang="x-default" href="https://decodeb64.com/" />
  <script>
    (function () {
      var saved = localStorage.getItem('b64_lang');
      var supported = ['en','es','pt','fr','de','it','zh','ru'];
      var lang = 'en';

      if (saved && supported.indexOf(saved) !== -1) {
        lang = saved;
      } else {
        var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        // Try exact match first (e.g. "zh")
        var code = nav.split('-')[0];
        // Special case: zh-tw / zh-hk → zh
        if (code === 'zh') { lang = 'zh'; }
        else if (supported.indexOf(code) !== -1) { lang = code; }
        else { lang = 'en'; }
      }

      window.location.replace('/' + lang + '/');
    })();
  </script>
  <style>
    body { margin: 0; background: #0d0d14; color: #e8e8f0;
           font-family: system-ui, sans-serif; display: flex;
           align-items: center; justify-content: center; height: 100vh; }
    a { color: #ff8c42; }
  </style>
</head>
