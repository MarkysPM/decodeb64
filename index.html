  <script>
    (function () {
      var saved = localStorage.getItem('b64_lang');
      var supported = ['en','es','pt','fr','de','it','zh','ru'];
      var lang = 'en';

      if (saved && supported.indexOf(saved) !== -1) {
        lang = saved;
      } else {
        var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        // Try exact match first (e.g. "zh")
        var code = nav.split('-')[0];
        // Special case: zh-tw / zh-hk → zh
        if (code === 'zh') { lang = 'zh'; }
        else if (supported.indexOf(code) !== -1) { lang = code; }
        else { lang = 'en'; }
      }

      window.location.replace('/' + lang + '/');
    })();
  </script>
